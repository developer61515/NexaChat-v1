%;background:#d9ff3f;display:grid;place-items:center;font-weight:950;font-size:14px;box-shadow:2px 2px 0 #111}.rowMain{min-width:0;flex:1}.rowTitle,.rowSub{display:flex;align-items:center;justify-content:space-between;gap:12px}.rowTitle b{font-size:15px}.rowTitle span,.rowSub{font-size:12px;color:#555}.rowSub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rowSub strong{flex:0 0 auto;display:grid;place-items:center;background:#111;color:#d9ff3f;border-radius:50%;width:22px;height:22px;font-size:11px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#111;border:2.5px solid #111;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;z-index:10}nav button{border:0;background:transparent;color:#fff;min-height:58px;border-radius:9px;display:grid;place-items:center;gap:3px;font:700 10px inherit}nav button.active{background:#d9ff3f;color:#111}.chatScreen{display:flex;flex-direction:column;background:#eeeede}.chatHead{min-height:72px;background:#d9ff3f;border-bottom:2.5px solid #111;display:flex;align-items:center;gap:9px;padding:10px 12px;position:sticky;top:0;z-index:2}.headInfo{flex:1;min-width:0}.headInfo b,.headInfo span{display:block}.headInfo b{font-size:15px}.headInfo span{font-size:11px;margin-top:2px}.chatHead .iconBtn{box-shadow:none;border-width:2px;min-width:40px;height:40px}.messages{flex:1;padding:22px 15px 95px;display:flex;flex-direction:column;gap:9px;overflow:auto}.bubble{max-width:78%;padding:10px 12px;border:2.5px solid #111;border-radius:12px;box-shadow:2px 2px 0 #111;font-size:14px;line-height:1.35}.bubble.them{align-self:flex-start;background:#fff}.bubble.me{align-self:flex-end;background:#d9ff3f}.bubble small{display:flex;justify-content:flex-end;align-items:center;gap:3px;margin-top:5px;font-size:9px;color:#444}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:flex;gap:8px;align- </style></head><body><div id="root"></div><script>
const chats=[{id:1,name:'Mika',type:'chat',text:'Design-nya sudah siap?',time:'20:01',online:true},{id:2,name:'Project Core',type:'group',text:'Raka: Build malam ini.',time:'19:44',unread:3},{id:3,name:'Tech Channel',type:'channel',text:'New post · Mobile architecture',time:'18:20'},{id:4,name:'Nara',type:'chat',text:'File sudah saya kirim.',time:'17:52'}];let tab='chats',selected=null,q='',msg='';let messages=[['them','Selamat datang di Lucky Chat.','19:58'],['me','UI-nya harus clean dan presisi.','19:59'],['them','Siap. Tidak ada elemen yang saling timpah.','20:00']];
const svg=(n,s=22)=>{let d={chat:'<path d="M4 5.5h16v11H9l-5 4v-4H4z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m15 5-7 7 7 7"/>',send:'<path d="m4 4 16 8-16 8 3-8z"/><path d="M7 12h13"/>',phone:'<path d="M7 4.5 10 7l-2 2.5a13 13 0 0 0 4 4l2.5-2L17 14.5c.7.8.7 2-.1 2.7l-1.2 1.1C9 18 6 14 4.1 8.2L5.3 7c.7-.8 1.9-1 2.7-.1Z"/>',video:'<rect x="3.5" y="6" width="12" height="12" rx="2"/><path d="m15.5 10 5-3v10l-5-3z"/>',mic:'<rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',more:'<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>',group:'<circle cx="9" cy="9" r="3"/><path d="M3.5 19c.5-3 2.3-4.5 5.5-4.5s5 1.5 5.5 4.5M16 7a3 3 0 0 1 0 6M16 14.5c2.3 0 4 1.5 4.5 4"/>',channel:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5l-.3 3a8 8 0 0 0-1.7 1l-2.4-1-2 3.5L5.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.3 3h5l.3-3a8 8 0 0 0 1.7-1l2.4 1 2.4 1 2-3.5-2-1.5c.1-.3.1-.7.1-1Z"/>',check:'<path d="m5 12 4 4L19 6"/>'};return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+d[n]+'</svg>'};
function avatar(n){return '<div class="avatar">'+n.split(' ').map(x=>x[0]).join('').slice(0,2)+'</div>'}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){if(selected){document.body.innerHTML='<div class="app"><section class="chatScreen"><header class="chatHead"><button class="iconBtn" onclick="selected=null;render()">'+svg('back')+'</button>'+avatar(selected.name)+'<div class="headInfo"><b>'+esc(selected.name)+'</b><span>'+(selected.online?'online':'last seen recently')+'</span></div><button class="iconBtn">'+svg('phone')+'</button><button class="iconBtn">'+svg('video')+'</button><button class="iconBtn">'+svg('more')+'</button></header><div class="messages">'+messages.map(m=>'<div class="bubble '+m[0]+'"><div>'+esc(m[1])+'</div><small>'+m[2]+(m[0]==='me'?svg('check',13):'')+'</small></div>').join('')+'</div><div class="composer"><button class="iconBtn">'+svg('plus')+'</button><input id="msg" placeholder="Message" value="'+esc(msg)+'"><button class="sendBtn" onclick="send()">'+svg(msg?'send':'mic')+'</button></div></section></div>';document.getElementById('msg').focus();document.getElementById('msg').oninput=e=>{msg=e.target.value};document.getElementById('msg').onkeydown=e=>{if(e.key==='Enter')send()};return}let list=chats.filter(x=>(tab==='chats'?x.type==='chat':tab==='groups'?x.type==='group':x.type==='channel')&&x.name.toLowerCase().includes(q.toLowerCase()));document.body.innerHTML='<div class="app"><section class="shell"><header class="top"><div><span class="eyebrow">LUCKY CHAT</span><h1>'+({chats:'Chats',groups:'Groups',channels:'Channels'}[tab])+'</h1></div><div class="topActions"><button class="iconBtn">'+svg('search')+'</button><button class="primaryIcon">'+svg('plus')+'</button></div></header><div class="search">'+svg('search',19)+'<input id="q" placeholder="Search" value="'+esc(q)+'"></div><div class="quick"><button class="quickCard">'+svg('group')+'<b>New group</b></button><button class="quickCard">'+svg('channel')+'<b>New channel</b></button></div><div class="list">'+list.map(x=>'<button class="row" onclick="selected=chats.find(c=>c.id==='+x.id+');render()">'+avatar(x.name)+'<div class= function send(){let v=(document.getElementById('msg')||{}).value||msg;if(!v.trim())return;messages.push(['me',v.trim(),'now']);msg='';render()}render();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
